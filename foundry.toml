[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.scheduled.fuzz]
runs = 2048

[profile.scheduled.invariant]
runs = 256
depth = 96
fail_on_revert = true
