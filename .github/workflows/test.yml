name: Foundry tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

env:
  FOUNDRY_VERSION: "1.9.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v${{ env.FOUNDRY_VERSION }}
      - name: Run tests
        env:
          FOUNDRY_PROFILE: ${{ github.event_name == 'schedule' && 'scheduled' || 'default' }}
        run: forge test -vv
      - name: Check formatting
        run: forge fmt --check
      - name: Check lab mirrors
        run: python3 scripts/sync_lab_mirrors.py --check
      - name: Check lab manifests
        run: python3 scripts/check_manifests.py
      - name: Test Python infrastructure
        run: python3 -B -m unittest discover -s tests -v
      - name: Preserve failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-failure-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
